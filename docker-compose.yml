services:

  # Kafka

  kafka:
    image: confluentinc/cp-kafka:8.0.0
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT, INTERNAL:PLAINTEXT, EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: >
        INTERNAL://kafka:29092, CONTROLLER://kafka:29093, EXTERNAL://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka:29092, EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_NUM_PARTITIONS: 3

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka-data:/var/lib/kafka/data

  # PostgreSQL 

  postgresql:
    image: postgres:14
    hostname: postgresql

    environment:
      POSTGRES_DB: conduktor
      POSTGRES_USER: ${CONDUKTOR_DB_USER}
      POSTGRES_PASSWORD: ${CONDUKTOR_DB_PASSWORD}

    volumes:
      - conduktor-postgres-data:/var/lib/postgresql/data

  # Conduktor

  conduktor-console:
    image: conduktor/conduktor-console:1.47.0

    depends_on:
      - kafka
      - postgresql

    ports:
      - "8080:8080"

    environment:
      CDK_DATABASE_URL: postgresql://${CONDUKTOR_DB_USER}:${CONDUKTOR_DB_PASSWORD}@postgresql:5432/conduktor

      CDK_CLUSTERS_0_ID: aircraft-kafka
      CDK_CLUSTERS_0_NAME: Aircraft Kafka
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # Apache Flink - JobManager

  flink-jobmanager:
    image: flink:2.2.0-java21
    hostname: flink-jobmanager

    ports:
      - "8081:8081"

    command: jobmanager

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager

  # Apache Flink - TaskManager

  flink-taskmanager:
    image: flink:2.2.0-java21
    hostname: flink-taskmanager

    depends_on:
      - flink-jobmanager
      - kafka

    command: taskmanager

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4

  # ClickHouse

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.1.2041
    hostname: clickhouse

    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: aircraft
      CLICKHOUSE_USER: ${CLICKHOUSE_DB_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_DB_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

    volumes:
      - clickhouse-data:/var/lib/clickhouse

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # TimescaleDB

  timescaledb:
    image: timescale/timescaledb:2.29.2-pg17
    hostname: timescaledb

    ports:
      - "5434:5432"

    environment:
      POSTGRES_DB: aircraft
      POSTGRES_USER: ${TIMESCALE_DB_USER}
      POSTGRES_PASSWORD: ${TIMESCALE_DB_PASSWORD}

    volumes:
      - timescaledb-data:/var/lib/postgresql/data

# Volumes

volumes:
  kafka-data:
  conduktor-postgres-data:
  clickhouse-data:
  timescaledb-data:
